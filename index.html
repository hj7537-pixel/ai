<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Assistant - Copilot Studio</title>

  <!-- Google Font (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-start: #667eea;
      --bg-end: #764ba2;
      --card-bg: rgba(255,255,255,0.85);
      --glass: rgba(255,255,255,0.06);
      --muted: #69707a;
      --accent: #6EE7B7; /* green-ish accent */
      --glass-border: rgba(255,255,255,0.12);
      --shadow: 0 10px 30px rgba(18, 25, 33, 0.18);
      --radius-lg: 18px;
      --radius-md: 12px;
      --max-width: 1100px;
    }

    /* Reset & base */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(135deg,var(--bg-start),var(--bg-end)); color:#0b1220; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}
    body{display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}

    /* Container */
    .container{
      width:100%;
      max-width:var(--max-width);
      height:88vh;
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.8));
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-rows:72px 1fr 56px;
      transition:transform .35s cubic-bezier(.2,.9,.3,1), box-shadow .35s;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(8px) saturate(120%);
    }

    .container:focus-within{transform:translateY(-6px); box-shadow: 0 20px 50px rgba(7,12,20,0.28)}

    /* Header */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-bottom: 1px solid rgba(15,20,25,0.04);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:46px;height:46px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border:1px solid var(--glass-border);
      color:white;font-weight:700;font-size:16px;
      box-shadow: 0 6px 18px rgba(102,126,234,0.18), inset 0 -6px 12px rgba(0,0,0,0.06);
    }

    .title{
      display:flex;flex-direction:column;
      line-height:1;
    }
    .title h1{font-size:16px;color:#0b1220;font-weight:700;letter-spacing:-0.3px}
    .title p{font-size:12px;color:var(--muted);margin-top:2px}

    .header-actions{
      display:flex;align-items:center;gap:14px;
    }

    .status{
      display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;
    }
    .status-indicator{
      width:10px;height:10px;border-radius:50%;
      background: linear-gradient(180deg, #34D399, #10B981);
      box-shadow:0 0 10px rgba(16,185,129,0.28);
      animation:pulse 2s infinite;
    }
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12);opacity:.85}100%{transform:scale(1)}}

    .icon-btn{
      background:transparent;border:0;padding:8px;border-radius:10px;color:#0b1220;
      display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .icon-btn:hover{background:rgba(11,18,32,0.04)}

    /* Main area: left panel + chat frame */
    .main{
      display:grid;
      grid-template-columns:320px 1fr;
      gap:18px;
      padding:22px;
      align-items:stretch;
      overflow:hidden;
    }

    /* Left panel */
    .side{
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.5));
      border-radius:var(--radius-md);
      padding:18px;
      border:1px solid rgba(11,18,32,0.04);
      display:flex;flex-direction:column;gap:12px;
      min-height:0; /* allow children to scroll */
      box-shadow: 0 6px 18px rgba(12,18,30,0.04);
    }

    .profile{
      display:flex;gap:12px;align-items:center;
    }
    .avatar{
      width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#fff,#fff);display:flex;align-items:center;justify-content:center;color:var(--bg-end);font-weight:700;font-size:20px;border:1px solid rgba(0,0,0,0.04)
    }
    .meta h3{font-size:15px;margin-bottom:4px}
    .meta p{font-size:13px;color:var(--muted)}

    .side .section{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(11,18,32,0.03)}

    .quick-actions{display:flex;flex-direction:column;gap:8px}
    .quick-actions button{
      background:transparent;border:1px solid rgba(11,18,32,0.06);padding:10px;border-radius:10px;text-align:left;cursor:pointer;font-size:14px;color:#0b1220;
    }
    .quick-actions button:hover{background:linear-gradient(90deg, rgba(102,126,234,0.06), rgba(118,75,162,0.04))}

    /* Chat wrapper (iframe) */
    .chat-wrapper{
      background: linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.6));
      border-radius:var(--radius-md);
      padding:12px;
      border:1px solid rgba(11,18,32,0.04);
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .chat-toolbar{
      display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.45));
      border: 1px solid rgba(11,18,32,0.03);margin-bottom:10px;
    }
    .chat-toolbar .left{display:flex;align-items:center;gap:10px}
    .chat-toolbar .title{font-weight:600}
    .chat-frame{
      flex:1;border-radius:10px;overflow:hidden;background:var(--card-bg);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .chat-frame iframe{width:100%;height:100%;border:0;display:block}

    /* Footer / Input area */
    .footer{
      display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(0deg, rgba(255,255,255,0.9), rgba(255,255,255,0.9));
      border-top:1px solid rgba(11,18,32,0.04);
    }
    .input{
      flex:1;display:flex;align-items:center;gap:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,246,248,0.95));
      padding:8px;border-radius:12px;border:1px solid rgba(11,18,32,0.04);
    }
    .input input{
      border:0;outline:none;background:transparent;font-size:14px;color:#0b1220;width:100%;
    }
    .send-btn{
      background:linear-gradient(90deg,var(--bg-start),var(--bg-end));color:white;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:600;
      box-shadow: 0 8px 20px rgba(102,126,234,0.18);
    }
    .send-btn:active{transform:translateY(1px)}

    /* Responsive */
    @media (max-width:920px){
      .main{grid-template-columns:1fr;gap:12px;padding:16px}
      .side{order:2}
      .chat-wrapper{order:1}
      .container{height:92vh}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation:none;transition:none}
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-label="Copilot Studio">
    <header class="header" role="banner">
      <div class="brand" aria-hidden="false">
        <div class="logo" aria-hidden="true">CP</div>
        <div class="title">
          <h1>Copilot Studio</h1>
          <p>AI Assistant · 향상된 인터페이스</p>
        </div>
      </div>

      <div class="header-actions" role="navigation" aria-label="상태 및 작업">
        <div class="status" title="서비스 상태 정상" aria-live="polite">
          <span class="status-indicator" aria-hidden="true"></span>
          <span>Active</span>
        </div>

        <button class="icon-btn" title="설정" aria-label="설정">
          <!-- simple gear icon (SVG) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="#0b1220" opacity="0.9"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09c0-.66-.39-1.26-1-1.51a1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 0 1 4.27 18.9l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09c.66 0 1.26-.39 1.51-1a1.65 1.65 0 0 0-.33-1.82L4.27 7.1A2 2 0 0 1 7.1 4.27l.06.06a1.65 1.65 0 0 0 1.82.33h.09c.66 0 1.26-.39 1.51-1V3a2 2 0 0 1 4 0v.09c.24.61.85 1 1.51 1 .7 0 1.34.28 1.82.73l.06.06A2 2 0 0 1 19.73 7.1l-.06.06a1.65 1.65 0 0 0-.33 1.82c.2.48.87.9 1.51 1H21a2 2 0 0 1 0 4h-.09c-.66 0-1.26.39-1.51 1z" fill="#0b1220" opacity="0.12"/>
          </svg>
        </button>

        <button class="icon-btn" title="계정" aria-label="내 계정">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5z" fill="#0b1220" opacity="0.9"/>
            <path d="M4 20a8 8 0 0 1 16 0" stroke="#0b1220" stroke-opacity="0.08" stroke-width="1.2" fill="none"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="main" role="region" aria-label="메인 영역">
      <aside class="side" aria-label="사이드 패널">
        <div class="profile">
          <div class="avatar" aria-hidden="true">HJ</div>
          <div class="meta">
            <h3>Copilot User</h3>
            <p>AI 기반 작업 보조 · 빠른 시작 버튼 제공</p>
          </div>
        </div>

        <div class="section">
          <div style="font-weight:600;margin-bottom:8px">빠른 작업</div>
          <div class="quick-actions" role="list">
            <button role="listitem">새 채팅 시작</button>
            <button role="listitem">템플릿 불러오기</button>
            <button role="listitem">대화 내보내기</button>
          </div>
        </div>

        <div class="section" style="margin-top:auto">
          <div style="font-size:13px;color:var(--muted)">팁</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">
            · 프롬프트에 예시를 추가하면 더 정확한 답변을 얻을 수 있습니다.<br>
            · 반응형 레이아웃은 작은 화면에서 사이드바가 아래로 이동합니다.
          </div>
        </div>
      </aside>

      <div class="chat-wrapper" aria-label="채팅 영역">
        <div class="chat-toolbar" role="toolbar" aria-label="채팅 도구">
          <div class="left">
            <div style="font-weight:700" class="title">AI Assistant</div>
            <div style="font-size:13px;color:var(--muted);margin-left:10px">실시간 응답 · 안전 모드</div>
          </div>
          <div style="font-size:13px;color:var(--muted)">세션 · 자동 저장</div>
        </div>

        <div class="chat-frame" role="document" aria-label="대화 프레임">
          <!-- Keep original iframe usage, replace src with your chat page -->
          <iframe src="about:blank" title="Copilot chat frame" aria-label="대화 프레임의 내용"></iframe>
        </div>
      </div>
    </section>

    <footer class="footer" role="contentinfo" aria-label="입력 영역">
      <div class="input" role="search" aria-label="메시지 입력">
        <input type="text" placeholder="무엇을 도와드릴까요? 예: '회원가입 흐름 개선해줘' " aria-label="메시지" />
      </div>
      <button class="send-btn" aria-label="보내기">전송</button>
    </footer>
  </main>
</body>
</html>
